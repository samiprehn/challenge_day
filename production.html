<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Day — Production</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --night: #12160f; --night-2: #1a2016; --card: #202719; --card-edge: #333d28;
  --bone: #e9dfc6; --bone-dim: #a89f87; --ember: #ff8c2b; --ember-deep: #d9541e;
  --green: #7fd4be; --red: #e05c4a;
  --serif: "Alfa Slab One", "Rockwell", serif;
  --sans: "Barlow Semi Condensed", "Avenir Next Condensed", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--night); color: var(--bone); font-family: var(--sans);
  font-size: 16px; line-height: 1.45; min-height: 100vh;
  background-image: radial-gradient(900px 400px at 50% -120px, rgba(255,110,30,.12), transparent 70%);
}
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 60px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(24px, 6vw, 34px); text-align: center; }
h1 .lit { background: linear-gradient(180deg,#ffd390,var(--ember) 55%,var(--ember-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: var(--bone-dim); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.tabs button {
  font: 600 14px var(--sans); letter-spacing: .04em; text-transform: uppercase;
  background: none; border: 1px solid var(--card-edge); border-radius: 999px;
  color: var(--bone-dim); padding: 8px 16px; cursor: pointer;
}
.tabs button.on { background: var(--ember-deep); border-color: var(--ember-deep); color: #fff; }
.card { background: var(--card); border: 1px solid var(--card-edge); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.card h2 { font: 600 13px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--ember); margin-bottom: 10px; }
label { display: block; font-size: 13px; color: var(--bone-dim); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
input, select, textarea {
  font: 500 16px var(--sans); color: var(--bone); background: var(--night-2);
  border: 1px solid var(--card-edge); border-radius: 8px; padding: 9px 12px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ember); }
button { font: 600 15px var(--sans); color: var(--bone); background: var(--night-2); border: 1px solid var(--card-edge); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
button:hover { border-color: var(--ember); }
button.primary { background: var(--ember-deep); border-color: var(--ember-deep); color: #fff; }
button.danger { border-color: rgba(224,92,74,.5); color: var(--red); }
button.small { font-size: 13px; padding: 5px 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid rgba(255,255,255,.05); }
.row:last-child { border-bottom: none; }
.row .name { flex: 1; font-weight: 600; }
.row .pts { color: var(--ember); font-weight: 700; }
.row.out .name { opacity: .4; text-decoration: line-through; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.checks label {
  display: flex; align-items: center; gap: 6px; margin: 0;
  font: 600 14px var(--sans); text-transform: none; letter-spacing: 0; color: var(--bone);
  border: 1px solid var(--card-edge); border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
.checks label:has(input:checked) { border-color: var(--ember); color: var(--ember); background: rgba(255,140,43,.08); }
.checks input { width: auto; accent-color: var(--ember-deep); }
.assign-opt.dim, .assign-opt.same-gender { opacity: .4; }
.row select.gsel { width: auto; padding: 4px 6px; font-size: 13px; flex: 0 0 auto; }
.inline { display: flex; gap: 8px; align-items: end; }
.inline > * { flex: 1; }
.inline > button { flex: 0 0 auto; }
.hint { font-size: 13px; color: var(--bone-dim); margin-top: 6px; }
.hint a { color: var(--ember); }
.msg { color: var(--green); font-weight: 600; }
.err { color: var(--red); font-weight: 600; }
.tally .bar { height: 8px; background: var(--ember-deep); border-radius: 4px; margin-top: 3px; }
.sched-note { color: var(--bone-dim); font-size: 13px; }

/* draw overlay + timer big screen */
.big {
  position: fixed; inset: 0; background: var(--night); z-index: 50;
  display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
}
.big.show { display: flex; }
.big .headline { font: 600 16px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--ember); margin-bottom: 18px; }
.big .main { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 9vw, 84px); line-height: 1.15; }
.big .main .vs { color: var(--ember); font-size: .55em; display: block; margin: 8px 0; }
.big .sub2 { color: var(--bone-dim); margin-top: 16px; }
.big .close { position: absolute; top: 14px; right: 14px; }
.big .timer-digits { font-feature-settings: "tnum"; font-family: var(--serif); font-size: clamp(70px, 22vw, 220px); }
.big .timer-digits.warn { color: var(--red); }
.big .controls { display: flex; gap: 10px; margin-top: 22px; }
#gate { max-width: 420px; margin: 60px auto; }
.confetti {
  position: absolute; top: -40px; font-size: 26px; pointer-events: none;
  animation: fall 3.2s linear infinite;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}
.horn {
  position: fixed; right: 14px; bottom: 14px; z-index: 60;
  width: 52px; height: 52px; border-radius: 50%; font-size: 24px;
  background: var(--ember-deep); border-color: var(--ember-deep);
}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="lit">Challenge</span> Day <span style="font-size:.55em; color:var(--bone-dim)">PROD</span></h1>
  <div class="sub">Production control</div>

  <div class="card" id="gate">
    <h2>Crew only</h2>
    <label>Production token</label>
    <input id="tokenIn" type="password" placeholder="paste the token">
    <button class="primary" style="width:100%; margin-top:10px" onclick="saveToken()">Enter</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="app" style="display:none">
    <div class="tabs" id="tabs">
      <button data-t="board" class="on">Board</button>
      <button data-t="sched">Schedule</button>
      <button data-t="pack">Packing</button>
      <button data-t="run">Challenge</button>
      <button data-t="draw">The Draw</button>
      <button data-t="vote">Vote</button>
      <button data-t="log">Log</button>
      <button data-t="timer">Timer</button>
    </div>
    <div id="tabBody"></div>
  </div>

  <div style="text-align:center; color:var(--bone-dim); font-size:13px">
    <a href="index.html" style="color:var(--ember)">participant view →</a>
  </div>
</div>

<div class="big" id="big"></div>
<button class="horn" onclick="airhorn()" title="Air horn">📣</button>

<script>
const WORKER = "https://challenge-day.sami-prehn.workers.dev";
const ARCHIVE = "https://samiprehn.github.io/challenge_archive/";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const uid = () => Date.now() + "-" + Math.floor(Math.random() * 1e6);
let state = null, tab = "board", token = localStorage.getItem("cd_token") || "";

/* ---------- sync ---------- */
async function pull() {
  const r = await fetch(WORKER + "/state", { headers: { "X-Token": token } });
  return r.json();
}
async function push() {
  const r = await fetch(WORKER + "/update", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Token": token },
    body: JSON.stringify({ state }),
  }).then(r => r.json()).catch(() => ({ error: "network error" }));
  if (r.error) alert("Save failed: " + r.error);
  else state = r.state; // server hands back the merged state (picks up any votes merged server-side) — no need for a follow-up read that could race a not-yet-propagated KV write
  render();
}
async function saveToken() {
  token = $("#tokenIn").value.trim();
  // verify by reading only — never write here, so a flaky connection can't ever overwrite live state with a blank one
  const test = await pull().catch(() => ({ error: "network error" }));
  if (test.error) { $("#gateErr").textContent = test.error === "bad token" ? "Wrong token." : test.error; return; }
  localStorage.setItem("cd_token", token);
  boot();
}

async function boot() {
  try {
    state = await pull();
    if (state.error) throw 0;
  } catch { $("#gate").style.display = ""; $("#app").style.display = "none"; return; }
  $("#gate").style.display = "none";
  $("#app").style.display = "";
  render();
}

/* refresh (skip while typing) */
setInterval(async () => {
  if (!state || document.activeElement.matches("input, select, textarea")) return;
  if ($("#big").classList.contains("show")) return;
  if (tab === "run") return; // don't wipe an in-progress challenge selection / winner-loser picks
  try { const s = await pull(); if (!s.error) { state = s; render(); } } catch {}
}, 8000);

/* ---------- helpers ---------- */
const active = () => state.players.filter(p => p.active !== false);
function totals() {
  const t = {};
  state.players.forEach(p => t[p.name] = 0);
  state.log.forEach(l => Object.entries(l.points || {}).forEach(([n, p]) => t[n] = (t[n] || 0) + p));
  return t;
}
function coinPools() {
  const pools = { M: 0, W: 0, total: 0 };
  state.players.forEach(p => { pools.total += (p.coins || 0); if (pools[p.gender] !== undefined) pools[p.gender] += (p.coins || 0); });
  return pools;
}
const checklist = (id, names, precheck) => `<div class="checks">${names.map(n =>
  `<label><input type="checkbox" data-cl="${id}" value="${esc(n)}" ${precheck && precheck.includes(n) ? "checked" : ""}>${esc(n)}</label>`).join("")}</div>`;
const checked = id => [...document.querySelectorAll(`input[data-cl="${id}"]:checked`)].map(i => i.value);
const teams = () => {
  const g = {};
  active().forEach(p => { if (p.team) (g[p.team] = g[p.team] || []).push(p.name); });
  return g;
};
// if a team is down to one active member (their partner left/was eliminated), it's not a team anymore
function clearSingletonTeam(team) {
  if (!team) return;
  const remaining = active().filter(p => p.team === team);
  if (remaining.length === 1) delete remaining[0].team;
}
// one-tap team buttons that check/uncheck a whole team in a checklist
const teamButtons = id => {
  const g = teams();
  return Object.keys(g).length ? `<div class="checks" style="margin-bottom:4px">${Object.keys(g).map(t =>
    `<button class="small" onclick="toggleTeam('${esc(id)}','${esc(t)}')">⚑ ${esc(t)}</button>`).join("")}</div>` : "";
};
function toggleTeam(id, team) {
  const members = teams()[team] || [];
  const boxes = [...document.querySelectorAll(`input[data-cl="${id}"]`)].filter(b => members.includes(b.value));
  const allOn = boxes.every(b => b.checked);
  boxes.forEach(b => b.checked = !allOn);
}

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

function render() {
  if (!state) return;
  ({ board, run, sched, pack, draw, vote, log, timer })[tab]();
}

/* ---------- board ---------- */
function board() {
  const t = totals();
  const hasTeams = state.players.some(p => p.team);
  const rows = [...state.players].sort((a, b) =>
    (a.active === false) - (b.active === false) || (a.team || "￿").localeCompare(b.team || "￿") || t[b.name] - t[a.name]).map(p => `
    <div class="row ${p.active === false ? "out" : ""}">
      <span class="name">${esc(p.name)}${p.coins ? ` 🪙${p.coins > 1 ? "×" + p.coins : ""}` : ""}${p.team && p.active !== false ? ` <span class="sched-note">· ${esc(p.team)}</span>` : ""}</span>
      <select class="gsel" onchange="setGender('${esc(p.name)}', this.value)">
        <option value="">–</option>
        <option value="M" ${p.gender === "M" ? "selected" : ""}>M</option>
        <option value="W" ${p.gender === "W" ? "selected" : ""}>W</option>
      </select>
      <span class="pts">${t[p.name] || 0}</span>
      ${state.settings.coinMode ? `<button class="small" onclick="coinEdit('${esc(p.name)}')">🪙 edit</button>` : ""}
      ${state.claims && state.claims[p.name] ? `<button class="small" onclick="releaseName('${esc(p.name)}')" title="unlink from their phone">release</button>` : ""}
      <button class="small" onclick="toggleOut('${esc(p.name)}')">${p.active === false ? "revive" : "eliminate"}</button>
      <button class="small danger" onclick="removePlayer('${esc(p.name)}')">✕</button>
    </div>`).join("");
  $("#tabBody").innerHTML = `
    <div class="card"><h2>Players</h2>
      ${rows || `<div class="sched-note">No players yet.</div>`}
      ${hasTeams ? `<button class="small danger" style="margin-top:10px" onclick="clearTeams()">Clear teams</button>` : ""}
      <div class="inline" style="margin-top:12px">
        <input id="newPlayer" placeholder="Add player">
        <button class="primary" onclick="addPlayer()">Add</button>
      </div>
    </div>
    <div class="card"><h2>Assign teams / pairs</h2>
      <div class="hint" style="margin-bottom:8px">Check a group, optionally name it, then Assign — repeat for each group. Leave the name blank to auto-name from first names.</div>
      ${assignChecklist()}
      <div class="inline" style="margin-top:10px">
        <input id="assignName" placeholder="Team name (optional)">
        <button class="primary" onclick="assignTeamGroup()">Assign</button>
      </div>
    </div>
    <div class="card"><h2>Settings</h2>
      <div class="checks"><label>
        <input type="checkbox" id="hideDetails" ${state.settings.hideDetails ? "checked" : ""}>
        Hide details from players
      </label></div>
      <div class="hint">On = participants only see the leaderboard, no "Results so far" feed.</div>
      <div class="checks" style="margin-top:8px"><label>
        <input type="checkbox" id="elimMode" ${state.settings.eliminationMode ? "checked" : ""}>
        Real eliminations (losers are out of the game)
      </label></div>
      <div class="hint">Off = eliminations are just worth points; nobody sits out.</div>
      <div class="checks" style="margin-top:8px"><label>
        <input type="checkbox" id="coinMode" ${state.settings.coinMode ? "checked" : ""}>
        🪙 Elimination coins (win an elimination → earn a coin; a coin is required for the final)
      </label></div>
      <div class="hint">Coins are awarded automatically when you record an elimination win. Adjust manually with the 🪙 buttons above for steals, trades, or fixes.</div>
      ${state.settings.coinMode ? `
      <div class="inline" style="margin-top:8px">
        <div><label>Coin cap (blank = unlimited)</label>
          <input id="coinCap" type="number" min="1" value="${state.settings.coinCap || ""}"></div>
      </div>
      ${state.settings.coinCap ? `<div class="checks" style="margin-top:8px"><label>
          <input type="checkbox" id="coinCapByGender" ${state.settings.coinCapByGender ? "checked" : ""}>
          Track the cap separately per gender (requires tagging players M/W)
        </label></div>` : ""}
      <div class="hint">Once the pool hits the cap, an elimination win steals a coin from a loser who has one instead of minting a new one.${state.settings.coinCapByGender ? " Tag each player's gender with the M/W selector above — a steal only comes from the same gender." : ""}</div>
      ${state.settings.coinCap ? (state.settings.coinCapByGender
        ? `<div class="hint">🪙 Men: ${coinPools().M}/${state.settings.coinCap} · Women: ${coinPools().W}/${state.settings.coinCap}</div>`
        : `<div class="hint">🪙 Coins in play: ${coinPools().total}/${state.settings.coinCap}</div>`) : ""}
      ` : ""}
    </div>
    <div class="card"><h2>Event</h2>
      <div class="inline">
        <button onclick="newEvent(true)">New event — keep players</button>
        <button class="danger" onclick="newEvent(false)">New event — start fresh</button>
      </div>
      <div class="hint">Archives this event's results and clears the board${(state.past || []).length ? ` · ${(state.past).length} past event${state.past.length === 1 ? "" : "s"} archived` : ""}.</div>
    </div>`;
  $("#hideDetails").onchange = e => { state.settings.hideDetails = e.target.checked; push(); };
  $("#elimMode").onchange = e => { state.settings.eliminationMode = e.target.checked; push(); };
  $("#coinMode").onchange = e => { state.settings.coinMode = e.target.checked; push(); };
  if ($("#coinCap")) $("#coinCap").onchange = e => {
    const v = parseInt(e.target.value, 10);
    state.settings.coinCap = (!v || v <= 0) ? null : v;
    push();
  };
  if ($("#coinCapByGender")) $("#coinCapByGender").onchange = e => { state.settings.coinCapByGender = e.target.checked; push(); };
  $("#newPlayer").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });
}
function addPlayer() {
  const n = $("#newPlayer").value.trim();
  if (!n || state.players.some(p => p.name === n)) return;
  state.players.push({ name: n, active: true });
  push();
}
function setGender(name, g) {
  const p = state.players.find(p => p.name === name);
  if (!p) return;
  if (g) p.gender = g; else delete p.gender;
  push();
}
const assignChecklist = () => `<div class="checks">${active().map(p => `
  <label class="assign-opt ${p.team ? "dim" : ""}" data-name="${esc(p.name)}" data-gender="${esc(p.gender || "")}">
    <input type="checkbox" data-cl="assign" value="${esc(p.name)}" onchange="onAssignPick()">
    ${esc(p.name)}${p.team ? ` <span class="sched-note">· ${esc(p.team)}</span>` : ""}
  </label>`).join("")}</div>`;
function onAssignPick() {
  const genders = checked("assign")
    .map(n => { const p = state.players.find(p => p.name === n); return p && p.gender; })
    .filter(Boolean);
  document.querySelectorAll("label.assign-opt").forEach(label => {
    const g = label.dataset.gender;
    const box = label.querySelector("input");
    label.classList.toggle("same-gender", !!g && genders.includes(g) && !box.checked);
  });
}
function assignTeamGroup() {
  const members = checked("assign");
  if (!members.length) return alert("Pick at least one player.");
  const name = $("#assignName").value.trim();
  const label = name || members.map(n => n.split(" ")[0]).join(" & ");
  const oldTeams = new Set(members.map(n => { const p = state.players.find(p => p.name === n); return p && p.team; }).filter(Boolean));
  members.forEach(n => { const p = state.players.find(p => p.name === n); if (p) p.team = label; });
  oldTeams.forEach(clearSingletonTeam);
  (state.teamHistory = state.teamHistory || []).push({ id: uid(), ts: Date.now(), team: label, members });
  push();
}
function coinEdit(n) {
  const p = state.players.find(p => p.name === n);
  const v = prompt(`Coins for ${n}:`, p.coins || 0);
  if (v === null) return;
  const coins = parseInt(v, 10);
  if (isNaN(coins) || coins < 0) return alert("Enter a number, 0 or more.");
  p.coins = coins;
  push();
}
function releaseName(n) {
  delete state.claims[n];
  push();
}
function newEvent(keepPlayers) {
  if (!confirm(keepPlayers
    ? "Start a new event? Results, schedule, coins, and teams are archived and cleared; players stay."
    : "Start a completely fresh event? Players, results, and schedule are archived and cleared.")) return;
  if (!confirm("Really sure? The board resets for everyone.")) return;
  (state.past = state.past || []).push({
    ts: Date.now(), players: state.players, log: state.log, schedule: state.schedule,
  });
  state.players = keepPlayers
    ? state.players.map(p => ({ name: p.name, active: true, ...(p.gender ? { gender: p.gender } : {}) }))
    : [];
  state.log = [];
  state.schedule = [];
  state.poll = null;
  state.claims = {};
  delete state.timer;
  push();
}
function toggleOut(n) {
  const p = state.players.find(p => p.name === n);
  const eliminating = p.active !== false;
  const team = p.team;
  p.active = p.active === false;
  if (eliminating) { delete p.team; clearSingletonTeam(team); }
  push();
}
function removePlayer(n) {
  if (!confirm(`Remove ${n} entirely? (their points vanish from the board)`)) return;
  state.players = state.players.filter(p => p.name !== n);
  push();
}

/* ---------- run a challenge ---------- */
let runSchedId = null, editLogId = null;
function run() {
  const names = active().sort((a, b) => (a.team || "￿").localeCompare(b.team || "￿")).map(p => p.name);
  const upcoming = state.schedule.filter(s => !s.done);
  const editing = state.log.find(l => l.id === editLogId);
  $("#tabBody").innerHTML = `
    <div class="card"><h2>${editing ? `Editing: ${esc(editing.name)}` : "Record a challenge"}</h2>
      ${editing ? "" : `<label>Challenge (from the schedule)</label>
      <select id="chSched">
        <option value="">— pick a challenge —</option>
        ${upcoming.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.type)})</option>`).join("")}
      </select>
      ${upcoming.length ? "" : `<div class="hint">The schedule is empty — add challenges there first.</div>`}`}
      <div class="hint" id="schedRules" style="display:none"></div>
      <div class="hint" id="schedGear" style="display:none"></div>
      <div class="inline">
        <div><label>Type</label>
          <select id="chType"><option value="daily">Daily</option><option value="elimination">Elimination</option><option value="final">Final</option></select></div>
        <div><label>Format</label>
          <select id="chFmt"><option>Individual</option><option>Pairs</option><option>Teams</option></select></div>
        <div><label>Points each</label><input id="chPts" type="number" value="1"></div>
      </div>
      <label>Winner(s) — tap a team flag to select the whole team</label>
      ${teamButtons("win")}
      ${checklist("win", names)}
      <div id="elimExtra"></div>
      <button class="primary" style="width:100%; margin-top:14px" onclick="saveRun()">${editing ? "Update result" : "Save result"}</button>
      ${editing ? `<button style="width:100%; margin-top:8px" onclick="editLogId=null; run()">Cancel edit</button>

function editLog(id) { editLogId = id; $("#tabs [data-t=run]").click(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function deleteLog(id) {

  push();
}
function undoRun(id) {

  if (!confirm(`Undo this result for "${l.name}"? It'll be removed from the log and the schedule item goes back to un-recorded.`)) return;

function renderElimExtra() {

    $("#elimExtra").innerHTML = `

      } automatically.</div>` : ""}
      <label>Eliminated / loser ${state.settings.eliminationMode ? "(will be marked out)" : "(for the story — stays in)"}</label>
      ${teamButtons("lose")}

  } else if (type === "final" && state.settings.coinMode) {

  } else {
    $("#elimExtra").innerHTML = "";

function saveRun() {
  const editingEntry = state.log.find(l => l.id === editLogId);
  const schedItem = state.schedule.find(x => x.id === runSchedId);
  const name = editingEntry ? editingEntry.name : schedItem && schedItem.name;
  const winners = checked("win");
  if (!name) return $("#runMsg").innerHTML = `<span class="err">Pick a challenge from the schedule.</span>`;
  if (!winners.length) return $("#runMsg").innerHTML = `<span class="err">Pick at least one winner.</span>`;
  if (state.settings.coinMode && state.settings.coinCap && state.settings.coinCapByGender && $("#chType").value === "elimination") {
    const missing = winners.filter(n => { const p = state.players.find(p => p.name === n); return !p || !p.gender; });
    if (missing.length) return $("#runMsg").innerHTML =
      `<span class="err">Set a gender (M/W) for ${missing.join(", ")} on the Board tab before recording this win.</span>`;
  }
  const pts = +$("#chPts").value || 0;
  const losers = checked("lose");
  const points = {};
  winners.forEach(w => points[w] = pts);
  const teamMatch = Object.entries(teams()).find(([, m]) =>
    m.length === winners.length && m.every(n => winners.includes(n)));
  const teamLabel = teamMatch && (teamMatch[1].length > 2 ? `${teamMatch[0]} (${winners.join(", ")})` : teamMatch[0]);
  let summary = `Won by ${teamLabel || winners.join(" & ")} (+${pts} each)`;
  if (losers.length) summary += ` — ${losers.join(" & ")} eliminated`;
  if (editingEntry) {
    Object.assign(editingEntry, { name, type: $("#chType").value, format: $("#chFmt").value, points, summary });
    editLogId = null;
    push();
    run();
    return;
  }
  if (state.settings.coinMode && $("#chType").value === "elimination") {
    const notes = applyCoinAward(winners, losers);
    if (notes.length) summary += ` — ${notes.join("; ")}`;
  }
  state.log.push({ id: uid(), ts: Date.now(), name, type: $("#chType").value, format: $("#chFmt").value, points, summary });
  if (state.settings.eliminationMode) {
    const eliminatedTeams = new Set();
    losers.forEach(n => { const p = state.players.find(p => p.name === n); if (p) { eliminatedTeams.add(p.team); p.active = false; delete p.team; } });
    eliminatedTeams.forEach(clearSingletonTeam);
  }
  if (schedItem) schedItem.done = true;
  push();
  if ($("#chType").value === "final") return celebrate(winners);
  $("#tabs [data-t=board]").click();
}
function applyCoinAward(winners, losers) {
  const cap = state.settings.coinCap;
  const byGender = state.settings.coinCapByGender;
  const notes = [];
  winners.forEach(wname => {
    const w = state.players.find(p => p.name === wname);
    if (!w) return;
    if (!cap) { w.coins = (w.coins || 0) + 1; return; } // uncapped: legacy behavior
    const g = w.gender;
    const inPool = p => byGender ? p.gender === g : true;
    const label = byGender ? (g === "M" ? "Men" : "Women") : "Coins in play";
    const poolSum = state.players.filter(inPool).reduce((s, p) => s + (p.coins || 0), 0);
    if (poolSum < cap) {
      w.coins = (w.coins || 0) + 1;
      notes.push(`🪙 ${wname} earns a coin (${label} ${poolSum + 1}/${cap})`);
    } else {
      const victim = losers
        .map(n => state.players.find(p => p.name === n))
        .find(p => p && inPool(p) && (p.coins || 0) > 0);
      if (victim) {
        victim.coins -= 1;
        w.coins = (w.coins || 0) + 1;
        notes.push(`🪙 ${wname} steals a coin from ${victim.name}`);
      } else {
        notes.push(`🪙 ${label} cap reached (${cap}/${cap}) — no eligible loser to steal from, ${wname} gets no coin`);
      }
    }
  });
  return notes;
}
function celebrate(winners) {
  const t = totals();
  const standings = [...state.players].sort((a, b) => (t[b.name] || 0) - (t[a.name] || 0))
    .slice(0, 5).map((p, i) => `${["🥇", "🥈", "🥉", "4.", "5."][i]} ${esc(p.name)} — ${t[p.name] || 0}`).join("<br>");
  bigShow(`
    ${Array.from({ length: 24 }, (_, i) => `<span class="confetti" style="left:${(i * 41) % 100}%; animation-delay:${(i % 8) * 0.35}s">${"🎉🔥🏆✨"[i % 4]}</span>`).join("")}
    <div class="headline">Your champion${winners.length > 1 ? "s" : ""}</div>
    <div class="main">🏆 ${winners.map(esc).join(" & ")}</div>
    <div class="sub2" style="font-size:20px; line-height:1.6; margin-top:20px">${standings}</div>
    <div class="controls"><button class="primary" onclick="bigHide()">Done</button></div>`);
}

/* ---------- log ---------- */
function log() {
  const entries = [
    ...state.log.map(l => ({ kind: "challenge", ts: l.ts, data: l })),
    ...(state.voteHistory || []).map(v => ({ kind: "vote", ts: v.ts, data: v })),
    ...(state.teamHistory || []).map(t => ({ kind: "team", ts: t.ts, data: t })),
  ].sort((a, b) => b.ts - a.ts);
  const rows = entries.map(e => {
    if (e.kind === "challenge") {
      const l = e.data;
      return `<div class="row">
        <span class="name">🏆 ${esc(l.name)} <span class="sched-note">· ${esc(l.type)}${l.format ? " · " + esc(l.format) : ""} · ${esc(l.summary || "")}</span></span>

        <button class="small danger" onclick="deleteLog('${esc(l.id)}')">✕</button>

    }
    if (e.kind === "team") {
      const t = e.data;

        <button class="small danger" onclick="deleteTeamLog('${esc(t.id)}')">✕</button>
      </div>`;
    }

    const lines = Object.entries(tally).sort((a, b) => b[1] - a[1]);

      <div style="display:flex; justify-content:space-between; align-items:center">

function addSched() {

function moveSched(i, d) {

/* ---------- the draw ---------- */
function draw() {
  $("#tabBody").innerHTML = `
    <div class="card"><h2>The Draw</h2>
      <div class="hint" style="margin-bottom:10px">Theater only — nothing here is saved or shown to participants.</div>
      <div class="checks">
        <label><input type="radio" name="dmode" value="pairs" checked>Random pairs</label>
        <label><input type="radio" name="dmode" value="teams">Split into teams</label>
        <label><input type="radio" name="dmode" value="one">Pick one player</label>
        <label><input type="radio" name="dmode" value="duel">1 v 1 matchup</label>
      </div>
      <div class="inline" style="margin-top:10px">
        <div id="teamsN" style="display:none"><label>How many teams</label><input id="nTeams" type="number" value="2" min="2"></div>
      </div>
      <label>Exempt from the draw (safe / sitting out)</label>
      ${checklist("exempt", active().map(p => p.name))}
      <button class="primary" style="width:100%; margin-top:12px" onclick="runDraw()">🔥 Draw</button>
    </div>`;
  document.querySelectorAll('input[name="dmode"]').forEach(r => r.onchange = () =>
    $("#teamsN").style.display = document.querySelector('input[name="dmode"]:checked').value === "teams" ? "" : "none");
}
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let lastDraw = null; // {mode, groups} for pairs/teams so they can be saved to the board
function runDraw() {
  const mode = document.querySelector('input[name="dmode"]:checked').value;
  const exempt = checked("exempt");
  const pool = shuffle(active().map(p => p.name).filter(n => !exempt.includes(n)));
  if (pool.length < 2) return alert("Need at least 2 non-exempt active players.");
  let result, headline;
  lastDraw = null;
  if (mode === "pairs") {
    headline = "The pairs are…";
    const groups = [];
    for (let i = 0; i + 1 < pool.length; i += 2) groups.push([pool[i], pool[i + 1]]);
    if (pool.length % 2) groups[groups.length - 1].push(pool[pool.length - 1]);
    lastDraw = { mode, groups };
    result = groups.map(g => g.join(" & ")).join("<br>");
  } else if (mode === "teams") {
    headline = "The teams are…";
    const n = Math.max(2, +$("#nTeams").value || 2);
    const groups = Array.from({ length: n }, () => []);
    pool.forEach((p, i) => groups[i % n].push(p));
    lastDraw = { mode, groups };
    result = groups.map((t, i) => `<span style="color:var(--ember)">Team ${i + 1}:</span> ${t.join(", ")}`).join("<br>");
  } else if (mode === "one") {
    headline = "The draw picks…";
    result = pool[0];
  } else {
    headline = "Face-off!";
    result = `${pool[0]}<span class="vs">vs</span>${pool[1]}`;
  }
  bigShow(`<div class="headline">${headline}</div><div class="main" id="bigMain"></div>
    <div class="controls"><button onclick="runDraw()">Draw again</button>
      ${lastDraw ? `<button onclick="saveTeams()">Set as current teams</button>` : ""}
      <button class="primary" onclick="bigHide()">Done</button></div>`);
  // suspense: cycle names, then land
  const el = $("#bigMain");
  let ticks = 0;
  const spin = setInterval(() => {
    el.innerHTML = pool[Math.floor(Math.random() * pool.length)];
    if (++ticks > 14) { clearInterval(spin); el.innerHTML = result; }
  }, 120);
}
function saveTeams() {
  if (!lastDraw) return;
  state.players.forEach(p => delete p.team);
  lastDraw.groups.forEach((members, i) => {
    const label = lastDraw.mode === "teams"
      ? `Team ${i + 1}`
      : members.map(n => n.split(" ")[0]).join(" & ");
    members.forEach(n => { const p = state.players.find(p => p.name === n); if (p) p.team = label; });
  });
  push();
  bigHide();
  $("#tabs [data-t=board]").click();
}
function clearTeams() { state.players.forEach(p => delete p.team); push(); }
function bigShow(html) { const b = $("#big"); b.innerHTML = `<button class="close" onclick="bigHide()">✕</button>` + html; b.classList.add("show"); }
function bigHide() { $("#big").classList.remove("show"); clearInterval(tInt); render(); }

/* ---------- vote ---------- */
function vote() {
  const p = state.poll;
  let body;
  if (p && p.open) {
    const tally = {}, votersByOption = {};
    p.options.forEach(o => { tally[o] = 0; votersByOption[o] = []; });
    Object.entries(p.votes || {}).forEach(([voter, c]) => { tally[c] = (tally[c] || 0) + 1; (votersByOption[c] = votersByOption[c] || []).push(voter); });
    const max = Math.max(1, ...Object.values(tally));
    const nVotes = Object.keys(p.votes || {}).length;
    body = `
      <div style="font-weight:700; margin-bottom:4px">${esc(p.question)}</div>
      <div class="hint">${nVotes} vote${nVotes === 1 ? "" : "s"} in · participants can't see the tally</div>
      <div class="tally" style="margin-top:10px">
        ${p.options.map(o => `<div style="margin-bottom:8px">
          <div style="display:flex; justify-content:space-between"><span>${esc(o)}</span><b style="color:var(--ember)">${tally[o]}</b></div>
          <div class="bar" style="width:${(tally[o] / max) * 100}%"></div>
          ${votersByOption[o].length ? `<div class="sched-note" style="margin-top:3px">${esc(votersByOption[o].join(", "))}</div>` : ""}</div>`).join("")}
      </div>
      <button class="danger" style="width:100%; margin-top:10px" onclick="closePoll()">Close voting</button>`;
  } else {
    const lastLog = [...state.log].reverse()[0];
    const lastWinners = lastLog ? Object.keys(lastLog.points || {}) : [];
    const allTeams = teams();
    const winningTeam = Object.entries(allTeams).find(([, m]) =>
      m.length === lastWinners.length && m.every(n => lastWinners.includes(n)));
    const winningTeamName = winningTeam ? winningTeam[0] : null;
    const hasTeams = Object.keys(allTeams).length > 0;
    const playerPrecheck = hasTeams ? [] : active().map(x => x.name).filter(n => !lastWinners.includes(n));
    const teamPrecheck = Object.keys(allTeams).filter(t => t !== winningTeamName);
    body = `
      <label>Question</label>
      <select id="pq">
        <option value="Who should go into elimination?">Who should go into elimination?</option>
        <option value="other">Other…</option>
      </select>
      <input id="pqOther" placeholder="Type your question" style="display:none; margin-top:8px">
      <label>Options — players</label>
      ${checklist("popt", active().map(x => x.name), playerPrecheck)}
      ${Object.keys(allTeams).length ? `<label>Options — teams</label>${checklist("popt", Object.keys(allTeams), teamPrecheck)}` : ""}
      <label>…or custom options (comma-separated)</label>
      <input id="pcustom" placeholder="Team Fire, Team Water">
      <button class="primary" style="width:100%; margin-top:12px" onclick="openPoll()">Open voting</button>
      ${p && !p.open ? renderClosedPoll(p) : ""}`;
  }
  $("#tabBody").innerHTML = `<div class="card"><h2>Tribunal vote</h2>${body}</div>`;
  if ($("#pq")) $("#pq").onchange = () => $("#pqOther").style.display = $("#pq").value === "other" ? "" : "none";
}
function renderClosedPoll(p) {
  const tally = {}, votersByOption = {};
  Object.entries(p.votes || {}).forEach(([voter, c]) => { tally[c] = (tally[c] || 0) + 1; (votersByOption[c] = votersByOption[c] || []).push(voter); });
  const lines = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  return `<div style="margin-top:16px"><h2>Last vote — ${esc(p.question)}</h2>
    ${lines.map(([o, n]) => `<div class="row" style="flex-direction:column; align-items:stretch">
      <div style="display:flex; justify-content:space-between"><span class="name">${esc(o)}</span><span class="pts">${n}</span></div>
      <div class="sched-note">${esc((votersByOption[o] || []).join(", "))}</div>
    </div>`).join("") || '<div class="sched-note">No votes were cast.</div>'}
    </div>`;
}
function openPoll() {
  const q = $("#pq").value === "other" ? $("#pqOther").value.trim() : $("#pq").value;
  const opts = [...checked("popt"), ...$("#pcustom").value.split(",").map(s => s.trim()).filter(Boolean)];
  if (!q || opts.length < 2) return alert("Need a question and at least two options.");
  state.poll = { id: uid(), open: true, question: q, options: opts, votes: {} };
  push();
}
function closePoll() {
  state.poll.open = false;
  (state.voteHistory = state.voteHistory || []).push({
    id: state.poll.id, ts: Date.now(), question: state.poll.question, options: state.poll.options, votes: state.poll.votes || {},
  });
  push();
}

/* ---------- timer ---------- */
let tInt = null;
function timer() {
  $("#tabBody").innerHTML = `
    <div class="card"><h2>Timer</h2>
      <div class="inline">
        <div><label>Countdown minutes (0 = stopwatch)</label><input id="tMin" type="number" value="3" min="0" step="0.5"></div>
        <button class="primary" onclick="startTimer()">Open big timer</button>
      </div>
    </div>`;
}
function airhorn() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const g = ctx.createGain();
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.5, ctx.currentTime);
    g.gain.setValueAtTime(0.5, ctx.currentTime + 0.9);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    [440, 554, 660].forEach(f => {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f, ctx.currentTime);
      o.frequency.setValueAtTime(f, ctx.currentTime + 0.75);
      o.frequency.exponentialRampToValueAtTime(f * 0.75, ctx.currentTime + 1.15);
      o.connect(g);
      o.start();
      o.stop(ctx.currentTime + 1.2);
    });
  } catch {}
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.3, 0.6].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(0.4, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  } catch {}
}
function startTimer() {
  const mins = +$("#tMin").value || 0;
  let remaining = Math.round(mins * 60), elapsed = 0, running = false;
  const countdown = mins > 0;
  bigShow(`<div class="headline">${countdown ? "Countdown" : "Stopwatch"}</div>
    <div class="timer-digits" id="tDig"></div>
    <div class="controls">
      <button class="primary" id="tGo">Start</button>
      <button id="tReset">Reset</button>
      <button onclick="document.documentElement.requestFullscreen?.()">Fullscreen</button>
    </div>`);
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const paint = () => {
    const v = countdown ? remaining : elapsed;
    const d = $("#tDig");
    if (!d) return clearInterval(tInt);
    d.textContent = fmt(v);
    d.classList.toggle("warn", countdown && remaining <= 10);
  };
  paint();
  const share = () => {
    if (!countdown) return;
    if (running) state.timer = { endsAt: Date.now() + remaining * 1000 };
    else delete state.timer;
    push(); // participants see the countdown live
  };
  $("#tGo").onclick = () => {
    running = !running;
    $("#tGo").textContent = running ? "Pause" : "Start";
    share();
  };
  $("#tReset").onclick = () => { remaining = Math.round(mins * 60); elapsed = 0; running = false; $("#tGo").textContent = "Start"; paint(); share(); };
  clearInterval(tInt);
  tInt = setInterval(() => {
    if (!running) return;
    if (countdown) {
      remaining--;
      if (remaining <= 0) { remaining = 0; running = false; $("#tGo").textContent = "Start"; beep(); }
    } else elapsed++;
    paint();
  }, 1000);
}

/* ---------- boot ---------- */
if (token) boot(); else { $("#gate").style.display = ""; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --night: #12160f; --night-2: #1a2016; --card: #202719; --card-edge: #333d28;
  --bone: #e9dfc6; --bone-dim: #a89f87; --ember: #ff8c2b; --ember-deep: #d9541e;
  --green: #7fd4be;
  --serif: "Alfa Slab One", "Rockwell", serif;
  --sans: "Barlow Semi Condensed", "Avenir Next Condensed", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--night); color: var(--bone); font-family: var(--sans);
  font-size: 16px; line-height: 1.45; min-height: 100vh;
  background-image: radial-gradient(900px 400px at 50% -120px, rgba(255,110,30,.14), transparent 70%);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 60px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 8vw, 44px); text-align: center; margin: 6px 0 2px; }
h1 .lit { background: linear-gradient(180deg,#ffd390,var(--ember) 55%,var(--ember-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: var(--bone-dim); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 18px; }
.card {
  background: var(--card); border: 1px solid var(--card-edge); border-radius: 12px;
  padding: 16px; margin-bottom: 14px;
}
.card h2 {
  font: 600 13px var(--sans); letter-spacing: .26em; text-transform: uppercase;
  color: var(--ember); margin-bottom: 10px;
}
.next { text-align: center; font-family: var(--serif); font-weight: 400; font-size: 24px; padding: 20px 16px; }
.next small { display: block; font: 600 12px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--bone-dim); margin-bottom: 6px; }
.next.daily { border-color: rgba(255,140,43,.5); }
.next.elimination { border-color: rgba(224,92,74,.6); background: linear-gradient(135deg, var(--card), #2a1713); }
.next.countdown { border-color: rgba(255,140,43,.6); font-size: 44px; font-feature-settings: "tnum"; }
.next.countdown.warn { color: #e05c4a; border-color: rgba(224,92,74,.8); }
.champ { text-align: center; border-color: rgba(255,215,0,.5); background: linear-gradient(135deg, var(--card), #2b2210); }
.champ .title { font-family: var(--serif); font-size: 28px; margin: 4px 0 10px; }
.champ .recap { color: var(--bone-dim); font-size: 14.5px; line-height: 1.7; }
.champ .recap b { color: var(--bone); }

.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
.row:last-child { border-bottom: none; }
.row .rank { color: var(--ember); font-weight: 700; width: 28px; }
.row .name { flex: 1; font-weight: 600; }
.row .pts { font-weight: 700; color: var(--ember); }
.row.out { opacity: .38; }
.row.out .name::after { content: " · eliminated"; font-weight: 400; font-size: 12px; color: var(--bone-dim); }
.row.team-head { margin-top: 8px; border-bottom: 1px solid var(--card-edge); }
.row.team-head .name { color: var(--ember); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; }
.row.member { padding-left: 16px; }
.row .pts.dim { color: var(--bone-dim); font-weight: 600; }

.vote-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
button, select {
  font: 600 15px var(--sans); color: var(--bone); background: var(--night-2);
  border: 1px solid var(--card-edge); border-radius: 8px; padding: 10px 14px; cursor: pointer;
}
button:hover { border-color: var(--ember); }
button.opt.picked { border-color: var(--ember); color: var(--ember); background: rgba(255,140,43,.08); }
button.primary { background: var(--ember-deep); border-color: var(--ember-deep); color: #fff; }
select { width: 100%; margin-bottom: 4px; }
.done-msg { color: var(--green); font-weight: 600; text-align: center; padding: 8px 0; }
.err { color: #e07856; font-size: 14px; margin-top: 6px; }

.feed-item { padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
.feed-item:last-child { border-bottom: none; }
.feed-item .top { display: flex; gap: 8px; align-items: baseline; }
.feed-item .cname { font-weight: 700; flex: 1; }
.badge { font: 700 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.badge.daily { background: var(--ember); color: var(--night); }
.badge.elimination { background: #e05c4a; color: var(--night); }
.badge.final { background: #ffd700; color: var(--night); }
.badge.fmt { background: none; border: 1px solid var(--card-edge); color: var(--bone-dim); }
.feed-item .res { color: var(--bone-dim); font-size: 14.5px; margin-top: 3px; }
.feed-item .res b { color: var(--bone); }
.empty { color: var(--bone-dim); text-align: center; padding: 10px 0; }
footer { text-align: center; color: var(--bone-dim); font-size: 13px; margin-top: 28px; }
footer a { color: var(--ember); text-decoration: none; }
.stale { text-align:center; color:#e07856; font-size:13px; margin-bottom:10px; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="lit">Challenge</span> Day</h1>
  <div class="sub">Leaderboard &middot; live</div>
  <div class="stale" id="stale">Connection lost — retrying…</div>

  <div class="card champ" id="champ" style="display:none"></div>

  <div class="card next countdown" id="countdown" style="display:none"></div>

  <div class="card next" id="next" style="display:none"></div>

  <div class="card" id="voteCard" style="display:none">
    <h2>Cast your vote</h2>
    <div id="voteBody"></div>
  </div>

  <div class="card">
    <h2>Leaderboard</h2>
    <div id="board"><div class="empty">Waiting for the game to start…</div></div>
  </div>

  <div class="card" id="feedCard">
    <h2>Results so far</h2>
    <div id="feed"><div class="empty">Nothing yet.</div></div>
  </div>

  <footer>
    Powered by way too much reality TV
    <div><a href="https://buymeacoffee.com/samiprehn" target="_blank" rel="noopener">Keep this page running ☕</a></div>
  </footer>
</div>

<script>
const WORKER = "https://challenge-day.sami-prehn.workers.dev";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
let state = null;
let pickedChoice = null;
let votedPollId = null; // survives a background refresh that hasn't caught up to our own vote yet
let DEVICE = localStorage.getItem("cd_device");
if (!DEVICE) {
  DEVICE = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("cd_device", DEVICE);
}

const coinStr = p => state.settings && state.settings.coinMode && p.coins
  ? ` 🪙${p.coins > 1 ? "×" + p.coins : ""}` : "";

function totals(st) {
  const t = {};
  st.players.forEach(p => t[p.name] = 0);
  st.log.forEach(l => Object.entries(l.points || {}).forEach(([n, p]) => { t[n] = (t[n] || 0) + p; }));
  return t;
}

function render() {
  if (!state) return;
  renderChamp();
  renderCountdown();
  // up next
  const next = $("#next");
  if (state.nextType) {
    next.style.display = "";
    next.className = "card next " + state.nextType;
    const label = { daily: "Daily Challenge", elimination: "Elimination", final: "Final Challenge" }[state.nextType] || state.nextType;
    next.innerHTML = `<small>Up next</small>${esc(label)}`;
  } else next.style.display = "none";

  // leaderboard — grouped by team when teams are set
  const t = totals(state);
  const hasTeams = state.players.some(p => p.team);
  if (hasTeams) {
    const groups = {}, eliminated = [];
    state.players.forEach(p => {
      if (p.active === false) { eliminated.push(p); return; }
      const g = p.team || "Free agents";
      (groups[g] = groups[g] || []).push(p);
    });
    const gTotal = g => g.reduce((s, p) => s + (t[p.name] || 0), 0);
    $("#board").innerHTML = Object.entries(groups)
      .sort((a, b) => gTotal(b[1]) - gTotal(a[1]))
      .map(([team, members]) => `
        <div class="row team-head"><span class="name">${esc(team)}</span><span class="pts">${gTotal(members)}</span></div>
        ${members.sort((a, b) => (t[b.name] || 0) - (t[a.name] || 0)).map(p => `
          <div class="row member">
            <span class="name">${esc(p.name)}${coinStr(p)}</span>
            <span class="pts dim">${t[p.name] || 0}</span>
          </div>`).join("")}`).join("")
      + eliminated.sort((a, b) => (t[b.name] || 0) - (t[a.name] || 0)).map(p => `
        <div class="row member out">
          <span class="name">${esc(p.name)}${coinStr(p)}</span>
          <span class="pts dim">${t[p.name] || 0}</span>
        </div>`).join("");
  } else {
    const players = [...state.players].sort((a, b) =>
      (b.active !== false) - (a.active !== false) || t[b.name] - t[a.name] || a.name.localeCompare(b.name));
    let prevPts = null, prevRank = 0;
    $("#board").innerHTML = players.length ? players.map((p, i) => {
      let rank = "–";
      if (p.active !== false) {
        const pts = t[p.name] || 0;
        if (prevPts === null || pts !== prevPts) { prevRank = i + 1; prevPts = pts; }
        rank = prevRank;
      }
      return `
      <div class="row ${p.active === false ? "out" : ""}">
        <span class="rank">${rank}</span>
        <span class="name">${esc(p.name)}${coinStr(p)}</span>
        <span class="pts">${t[p.name] || 0}</span>
      </div>`;
    }).join("") : `<div class="empty">Waiting for the game to start…</div>`;
  }

  // feed
  $("#feedCard").style.display = state.settings && state.settings.hideDetails ? "none" : "";
  const log = [...(state.log || [])].reverse();
  $("#feed").innerHTML = log.length ? log.map(l => `
    <div class="feed-item">
      <div class="top">
        <span class="cname">${esc(l.name)}</span>
        <span class="badge ${esc(l.type)}">${esc(l.type)}</span>
        ${l.format ? `<span class="badge fmt">${esc(l.format)}</span>` : ""}
      </div>
      <div class="res">${esc(l.summary || "")}</div>
    </div>`).join("") : `<div class="empty">Nothing yet.</div>`;

  renderVote();
}

function renderChamp() {
  const card = $("#champ");
  const final = [...(state.log || [])].reverse().find(l => l.type === "final");
  if (!final) { card.style.display = "none"; return; }
  const champions = Object.keys(final.points || {});
  const wins = type => {
    const w = {};
    state.log.filter(l => l.type === type).forEach(l => Object.keys(l.points || {}).forEach(n => w[n] = (w[n] || 0) + 1));
    const best = Object.entries(w).sort((a, b) => b[1] - a[1])[0];
    return best ? `<b>${esc(best[0])}</b> (${best[1]})` : "—";
  };
  const t = totals(state);
  const top = Object.entries(t).sort((a, b) => b[1] - a[1])[0];
  card.style.display = "";
  card.innerHTML = `
    <div class="title">🏆 ${champions.map(esc).join(" & ")}</div>
    <div class="recap">
      Most daily wins: ${wins("daily")}<br>
      Most elimination wins: ${wins("elimination")}<br>
      Top scorer: ${top ? `<b>${esc(top[0])}</b> (${top[1]})` : "—"}
    </div>`;
}

function renderCountdown() {
  const card = $("#countdown");
  const endsAt = state.timer && state.timer.endsAt;
  if (!endsAt || endsAt <= Date.now()) { card.style.display = "none"; return; }
  const s = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  card.style.display = "";
  card.classList.toggle("warn", s <= 10);
  card.innerHTML = `<small>Time left</small>⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
setInterval(() => { if (state) renderCountdown(); }, 1000);

function renderVote() {
  const card = $("#voteCard");
  if (!state.poll) { card.style.display = "none"; return; }
  card.style.display = "";
  const me = localStorage.getItem("cd_me") || "";
  if (me && (state.poll.voted.includes(me) || votedPollId === state.poll.id)) {
    $("#voteBody").innerHTML = `<div class="done-msg">Vote in, ${esc(me)} ✓</div>`;
    return;
  }
  $("#voteBody").innerHTML = `
    <select id="who">
      <option value="">Click to pick your name</option>
      ${state.players.filter(p => p.active !== false).map(p => {
        const taken = (state.claimed || []).includes(p.name) && p.name !== me;
        return `<option value="${esc(p.name)}" ${p.name === me ? "selected" : ""} ${taken ? "disabled" : ""}>${esc(p.name)}${taken ? " (taken)" : ""}</option>`;
      }).join("")}
    </select>
    <div style="font-weight:600; margin:10px 0 8px">${esc(state.poll.question)}</div>
    <div class="vote-opts">
      ${state.poll.options.map(o => `<button class="opt ${o === pickedChoice ? "picked" : ""}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}
    </div>
    <button class="primary" id="send" style="width:100%; margin-top:10px">Submit vote</button>
    <div class="err" id="voteErr"></div>`;
  document.querySelectorAll("#voteBody .opt").forEach(b => b.onclick = () => {
    pickedChoice = b.dataset.o;
    document.querySelectorAll("#voteBody .opt").forEach(x => x.classList.toggle("picked", x === b));
  });
  $("#send").onclick = async () => {
    const voter = $("#who").value;
    if (!voter) return $("#voteErr").textContent = "Pick your name first.";
    if (!pickedChoice) return $("#voteErr").textContent = "Pick an option.";
    const btn = $("#send");
    if (btn.disabled) return; // ignore double-taps while a submission is already in flight
    btn.disabled = true;
    btn.textContent = "Submitting…";
    $("#voteErr").textContent = "";
    localStorage.setItem("cd_me", voter);
    const r = await fetch(WORKER + "/vote", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voter, choice: pickedChoice, device: DEVICE }),
    }).then(r => r.json()).catch(() => ({ error: "network error" }));
    if (r.error) {
      $("#voteErr").textContent = r.error;
      btn.disabled = false;
      btn.textContent = "Submit vote";
      return;
    }
    pickedChoice = null;
    // show success immediately from the response we just got, and remember it durably —
    // a follow-up /state read (right now, or on the next background refresh) could still
    // return a stale, pre-write snapshot (KV writes/lists aren't instantly consistent),
    // which used to make a successful vote look like it silently failed and prompt people
    // to keep tapping Submit, or could even flip a shown "Vote in ✓" back to the form
    if (state.poll) { state.poll.voted = [...new Set([...(state.poll.voted || []), voter])]; votedPollId = state.poll.id; }
    render();
    refresh(); // pick up the real state in the background once it's propagated
  };
}

async function refresh() {
  try {
    state = await fetch(WORKER + "/state").then(r => r.json());
    $("#stale").style.display = "none";
    render();
  } catch {
    $("#stale").style.display = "block";
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
